name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: NEXUS experiment smoke
        run: python -m experiments.run_experiment --seeds 2 --cycles 2 --no-charts --output-dir ${{ runner.temp }}/axiom-experiment
      - name: Avatar pack tests
        working-directory: avatar-pack/backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Avatar pack typecheck
        run: ./node_modules/.bin/tsc -p ../avatar-pack/tsconfig.json
      - name: Avatar preview build
        run: |
          npm ci --prefix ../avatar-pack/preview
          npm run build --prefix ../avatar-pack/preview

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --file backend/Dockerfile backend
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --build-arg WS_URL=ws://localhost:8000 frontend
