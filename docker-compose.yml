services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MIN_PLAYERS: "1"
      ROUND_SECONDS: "12"
      ALLOWED_ORIGINS: "http://localhost:3000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AXIOM_MATCH_STORE: ${AXIOM_MATCH_STORE:-sqlite}
      AXIOM_DB: /data/axiom.db
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_APP_CHECK_ENFORCE: ${FIREBASE_APP_CHECK_ENFORCE:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-avatars}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
    volumes:
      - axiom-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        FIREBASE_APP_CHECK_SITE_KEY: ${FIREBASE_APP_CHECK_SITE_KEY:-}
        SITE_URL: ${SITE_URL:-http://localhost:3000}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        WS_URL: ${WS_URL:-ws://localhost:8000}
    environment:
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      FIREBASE_APP_CHECK_SITE_KEY: ${FIREBASE_APP_CHECK_SITE_KEY:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      WS_URL: ${WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  axiom-data:
